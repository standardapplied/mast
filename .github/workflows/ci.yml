name: CI

on:
  push:
    branches: [main]
    tags: ["mast-v*"]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Frontend tests (webview DOM + core)
        run: bun test
      - name: Build web bundle (satisfies the Rust build)
        run: bun run build:tauri-web
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  release:
    if: startsWith(github.ref, 'refs/tags/mast-v')
    needs: verify
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: bun install --frozen-lockfile

      # tauri-action wants the notarization key as a file on disk; decode the
      # base64 secret and point APPLE_API_KEY_PATH at it (job-wide via GITHUB_ENV).
      - name: Stage App Store Connect API key
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/asc_api_key.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/asc_api_key.p8" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Apple Developer ID signing
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Notarization (APPLE_API_KEY_PATH exported above)
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          # Updater artifact signing (minisign — independent of Apple signing)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target universal-apple-darwin
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: |
            Build record — public distribution is the GCS bucket.
          releaseDraft: true
          prerelease: false

      # The GitHub release stays private (a build record). The signed artifacts +
      # updater manifest are mirrored to an unlisted public GCS bucket so the Tauri
      # updater (which fetches unauthenticated) can reach them.
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Publish to GCS
        env:
          GCS_SA_KEY_BASE64: ${{ secrets.GCS_SA_KEY_BASE64 }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BUCKET="mast-dist-441983c05b7f"
          VERSION="$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")"
          echo "$GCS_SA_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/gcs_sa.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/gcs_sa.json"
          # Pull the signed artifacts + tauri-generated manifest from the draft release.
          mkdir -p "$RUNNER_TEMP/rel"
          gh release download "${{ github.ref_name }}" --dir "$RUNNER_TEMP/rel" \
            --pattern 'latest.json' --pattern '*.app.tar.gz' --pattern '*.dmg'
          # Repoint the manifest's URLs from the private GitHub release to the public
          # bucket, then upload artifacts (per-version) + the stable manifest.
          GCS_BASE="https://storage.googleapis.com/${BUCKET}/mast/${VERSION}"
          # The universal build produces one .app.tar.gz that every darwin key
          # points at; tauri's manifest uses opaque api.github.com asset URLs, so
          # rewrite them all to the bucket URL for that artifact.
          ARTIFACT="$(basename "$(ls "$RUNNER_TEMP/rel/"*.app.tar.gz | head -1)")"
          jq --arg url "${GCS_BASE}/${ARTIFACT}" \
            '.platforms |= map_values(.url = $url)' \
            "$RUNNER_TEMP/rel/latest.json" > "$RUNNER_TEMP/rel/latest.gcs.json"
          gcloud storage cp "$RUNNER_TEMP/rel/"*.app.tar.gz "gs://${BUCKET}/mast/${VERSION}/"
          gcloud storage cp "$RUNNER_TEMP/rel/"*.dmg "gs://${BUCKET}/mast/${VERSION}/"
          gcloud storage cp "$RUNNER_TEMP/rel/latest.gcs.json" "gs://${BUCKET}/mast/latest.json"
