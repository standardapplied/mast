name: CI

on:
  push:
    branches: [main]
    tags: ["mast-v*"]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Frontend tests (webview DOM + core)
        run: bun test
      - name: Build web bundle (satisfies the Rust build)
        run: bun run build:tauri-web
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  release:
    if: startsWith(github.ref, 'refs/tags/mast-v')
    needs: verify
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: bun install --frozen-lockfile

      # tauri-action wants the notarization key as a file on disk; decode the
      # base64 secret and point APPLE_API_KEY_PATH at it (job-wide via GITHUB_ENV).
      - name: Stage App Store Connect API key
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/asc_api_key.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/asc_api_key.p8" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Apple Developer ID signing
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Notarization (APPLE_API_KEY_PATH exported above)
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          # Updater artifact signing (minisign — independent of Apple signing)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target universal-apple-darwin
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: |
            Download `Mast_<version>_universal.dmg` below. Signed and notarized;
            the app updates itself from here after that.
          releaseDraft: true
          prerelease: false

      # tauri writes opaque `api.github.com/.../releases/assets/<id>` URLs into the
      # manifest, and a plain GET on those returns the asset's JSON metadata rather
      # than the binary. Rewrite them to the release's `releases/download/<tag>/<file>`
      # URLs, which always serve bytes to an unauthenticated client. The universal
      # build produces one .app.tar.gz that every darwin key points at.
      - name: Point the updater manifest at the release downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          mkdir -p "$RUNNER_TEMP/rel"
          gh release download "$TAG" --dir "$RUNNER_TEMP/rel" \
            --pattern 'latest.json' --pattern '*.app.tar.gz'
          ARTIFACT="$(basename "$(ls "$RUNNER_TEMP/rel/"*.app.tar.gz | head -1)")"
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${ARTIFACT}"
          jq --arg url "$URL" '.platforms |= map_values(.url = $url)' \
            "$RUNNER_TEMP/rel/latest.json" > "$RUNNER_TEMP/latest.json"
          gh release upload "$TAG" "$RUNNER_TEMP/latest.json" --clobber

      # Last: publishing is what makes those download URLs resolve for anonymous
      # clients, and what points `releases/latest/download/latest.json` (the updater
      # endpoint) at this build. Left a draft, the public download silently rots to
      # whatever was published before.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --latest
