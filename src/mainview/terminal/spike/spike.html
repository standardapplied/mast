<title>Terminal Renderer Spike</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  :root {
    color-scheme: dark;
    --ground: #0b0e14;
    --panel: #10141d;
    --panel-2: #141924;
    --hairline: #232b3a;
    --text: #c8d3e0;
    --muted: #6b7688;
    --faint: #444d5e;
    --accent: #4de0c8;
    --accent-dim: #2b7d72;
    --amber: #e0a24d;
    --green: #98c379;
    --display: "IBM Plex Mono", ui-monospace, monospace;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── top bar ── */
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 18px;
    border-bottom: 1px solid var(--hairline);
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    flex: 0 0 auto;
  }
  .wordmark {
    font-family: var(--display);
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text);
    white-space: nowrap;
  }
  .wordmark b { color: var(--accent); font-weight: 600; }
  .tagline {
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 0.04em;
    border-left: 1px solid var(--hairline);
    padding-left: 16px;
    white-space: nowrap;
  }
  .grow { flex: 1 1 auto; }
  .badge {
    font-family: var(--display);
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.12em;
    padding: 5px 12px;
    border-radius: 999px;
    border: 1px solid var(--accent-dim);
    color: var(--accent);
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    white-space: nowrap;
  }
  .badge[data-kind="webgl2"] {
    color: var(--amber);
    border-color: color-mix(in srgb, var(--amber) 45%, transparent);
    background: color-mix(in srgb, var(--amber) 12%, transparent);
  }
  .badge::before {
    content: "";
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: currentColor;
    margin-right: 8px;
    vertical-align: middle;
    box-shadow: 0 0 8px currentColor;
  }

  /* ── stage ── */
  main {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    place-items: center;
    padding: 26px;
    background:
      radial-gradient(120% 80% at 50% 0%, #0e131c 0%, var(--ground) 70%);
  }
  #stage {
    width: 100%;
    height: 100%;
    max-width: 1180px;
    display: grid;
    place-items: center;
  }
  .bezel {
    padding: 12px;
    border-radius: 12px;
    background: linear-gradient(160deg, #171d29, #0d1119);
    border: 1px solid var(--hairline);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.03) inset,
      0 24px 60px -30px rgba(0,0,0,0.9),
      0 0 60px -20px color-mix(in srgb, var(--accent) 30%, transparent);
  }
  canvas#screen {
    display: block;
    border-radius: 5px;
    background: var(--ground);
    box-shadow: 0 0 0 1px #05070b inset;
  }

  /* ── control strip ── */
  footer {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 11px 18px;
    border-top: 1px solid var(--hairline);
    background: linear-gradient(0deg, var(--panel-2), var(--panel));
  }
  .scenes { display: flex; gap: 6px; }
  button.scene {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.02em;
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--hairline);
    border-radius: 7px;
    padding: 6px 13px;
    cursor: pointer;
    transition: color .15s, border-color .15s, background .15s;
  }
  button.scene:hover { color: var(--text); border-color: var(--faint); }
  button.scene[aria-pressed="true"] {
    color: var(--ground);
    background: var(--accent);
    border-color: var(--accent);
    font-weight: 700;
  }
  button.scene:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .readouts { margin-left: auto; display: flex; gap: 22px; }
  .stat { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.25; }
  .stat .k {
    font-size: 9.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--faint);
  }
  .stat .v {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .stat .v#fps { color: var(--green); }

  #error {
    display: none;
    position: fixed;
    inset: auto 18px 18px 18px;
    max-height: 40vh;
    overflow: auto;
    padding: 14px 16px;
    border-radius: 8px;
    border: 1px solid color-mix(in srgb, var(--amber) 45%, transparent);
    background: #1a1410;
    color: var(--amber);
    font-size: 12px;
    white-space: pre-wrap;
    z-index: 10;
  }
  @media (max-width: 720px) {
    .tagline { display: none; }
    .readouts { gap: 14px; }
    footer { flex-wrap: wrap; }
  }
</style>

<header>
  <span class="wordmark">SAIL <b>·</b> Renderer</span>
  <span class="tagline">libghostty-vt state · our own GPU renderer</span>
  <span class="grow"></span>
  <span class="badge" id="backend" data-kind="webgpu">detecting…</span>
</header>

<main>
  <div id="stage">
    <div class="bezel">
      <canvas id="screen" width="800" height="480"></canvas>
    </div>
  </div>
</main>

<footer>
  <div class="scenes">
    <button class="scene" data-name="Typing" aria-pressed="true">Typing</button>
    <button class="scene" data-name="Truecolor" aria-pressed="false">Truecolor</button>
    <button class="scene" data-name="Matrix" aria-pressed="false">Matrix</button>
    <button class="scene" data-name="TUI" aria-pressed="false">TUI</button>
  </div>
  <div class="readouts">
    <div class="stat"><span class="k">FPS</span><span class="v" id="fps">—</span></div>
    <div class="stat"><span class="k">Grid</span><span class="v" id="dims">—</span></div>
    <div class="stat"><span class="k">Cell</span><span class="v" id="cellpx">—</span></div>
  </div>
</footer>

<div id="error"></div>

</script>
